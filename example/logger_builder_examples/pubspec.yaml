name: logger_builder_examples
description: Runnable examples for the logger_builder package.
version: 1.0.0
publish_to: none

# Not ^3.2.0 like the library: `logging` needs ^3.4.0, `ansi_escape_codes`
# and `lints` need ^3.6.0. Mirroring the library's floor claimed a guarantee
# this package cannot honour — `dart pub get` fails outright on 3.2.0.
environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^3.0.2
  logger_builder:
    path: ../../
  logging: ^1.3.0
  talker_logger: ^5.1.13

dev_dependencies:
  lints: ^5.0.0
