name: logger_builder_examples
description: Runnable examples for the logger_builder package.
version: 1.0.0
publish_to: none

# Same floor as the library. It could not go lower anyway: `logging` needs
# ^3.4.0, `ansi_escape_codes` and `lints` need ^3.6.0.
environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^4.0.1
  logger_builder:
    path: ../../
  logging: ^1.3.0
  talker_logger: ^5.1.13

dev_dependencies:
  lints: ^5.0.0
