# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: logger_builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Nothing pins the dependency versions — `pubspec.lock` is deliberately not
  # committed for a library — so a bad upstream release would otherwise only
  # surface on the next push. This is the compensating check.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer PR push supersedes an in-flight run for the same ref. Not on
# `main`: we merge straight there without PRs, so cancelling would leave the
# superseded commit without a finished run — and that is exactly the commit
# `docs/handoff.md` ends up citing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The strict gate: latest stable, newest dependencies, every check.
  verify:
    runs-on: ubuntu-latest
    # A runaway retry loop in a buffered publisher starves the event loop
    # instead of failing a test, so an unbounded job would hang for hours.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Install dependencies
        run: dart pub get

      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos is required: every rule in analysis_options.yaml is
      # reported as info, so a plain `dart analyze` exits 0 on all of them.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # M4 (project review 2026-08-20[1]): the package advertises
      # platform:web, runtime:web and is:wasm-ready, and until this step not
      # one line of it had ever run on either. pana, which decides those
      # tags, derives them from imports — statically — so it cannot notice a
      # runtime difference, and there are several to notice: WeakReference is
      # a JS WeakRef with the host's own collection policy, `int` is a double
      # under dart2js, and the microtask and timer ordering both pipelines
      # lean on is the browser's.
      #
      # Four tests are marked `testOn: 'vm'`: they assert that a collection
      # *happened*, which nothing on the web can be made to do. Everything
      # else runs on all three.
      - name: Run tests on the web
        run: dart test -p chrome

      - name: Run tests compiled to wasm
        run: dart test -p chrome -c dart2wasm

      # Item 1 of the release checklist (docs/conventions.md section 7), and
      # until now it lived only in that checklist. `dart doc` exits 0 on
      # warnings, so the count is what gets asserted.
      - name: Check the dartdoc
        run: |
          set -e
          # 2>&1 is load-bearing: dartdoc prints the summary to stderr,
          # so without it the log is empty and the grep fails on a clean
          # run — which is exactly how this step failed the first time.
          dart doc --output=/tmp/api 2>&1 | tee /tmp/doc.log
          grep -q 'Found 0 warnings and 0 errors' /tmp/doc.log

      # .pubignore is load-bearing here — the published example includes the
      # root analysis_options.yaml through a relative path — and nothing but a
      # dry run notices when it stops being right.
      #
      # M3 (project review 2026-08-20[1]): the dry run notices less than that
      # claimed. Measured on a clean clone — a file added to the root and left
      # out of .pubignore was listed in the tree, and the command still said
      # "Package has 0 warnings" and exited 0. The archive is the one artefact
      # that cannot be taken back, in either direction: a file that slips in
      # stays on pub.dev, and a file that silently drops out breaks the
      # published example. So the file list is asserted against
      # .github/published_files.txt, which is the archive as it is meant to
      # be. Sizes are stripped, names and structure are not. Regenerate it
      # the same way the check builds it, and read the diff before trusting
      # it.
      - name: Validate the published archive
        run: |
          set -euo pipefail
          dart pub publish --dry-run 2>&1 | tee /tmp/publish.log
          sed -n '/^Publishing logger_builder/,/^Total compressed archive size/p' \
            /tmp/publish.log |
            sed '1d;$d' |
            sed -E 's/ \([^)]*\)$//' |
            sed '/^$/d' > /tmp/archive.txt
          diff -u .github/published_files.txt /tmp/archive.txt

      # L5 (project review 2026-08-20[1]): the release checklist says to add
      # a CHANGELOG section for the version being published, and nothing
      # checked that its heading is that version. `(unreleased)` is allowed —
      # that is how a version is opened here — but the number has to match.
      - name: Check the CHANGELOG heading
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          heading=$(grep -m1 '^## ' CHANGELOG.md)
          case "$heading" in
            "## $version"|"## $version ("*) ;;
            *)
              echo "CHANGELOG heading '$heading' is not version $version"
              exit 1
              ;;
          esac
          echo "CHANGELOG heading matches $version"

      # The examples are the package's primary documentation and were only
      # ever type-checked. A deadlock or a runaway retry loop passes analysis
      # and hangs here instead, which is what the job timeout is for.
      # benchmarks.dart is excluded: it is long by design.
      # `find`, not two hand-written globs: a new subdirectory under bin/
      # used to drop out of the run silently while still being analysed. The
      # output is checked rather than discarded, because an example that
      # stopped printing anything and exited 0 is broken in the only way
      # that matters for something billed as documentation.
      - name: Run the examples
        working-directory: example/logger_builder_examples
        run: |
          set -e
          find bin -name '*.dart' ! -name 'benchmarks.dart' -print0 |
            sort -z |
            while IFS= read -r -d '' entry; do
              echo "--- $entry"
              out=$(dart run "$entry")
              [ -n "$out" ] || { echo "no output from $entry"; exit 1; }
            done

      # That the example itself still builds for the web targets — which is
      # all this does, and the name says so now (L10/M4). It is NOT the badge
      # check: `dart compile js` and `dart compile wasm` accept a `dart:io`
      # import and fail only at runtime, and the file compiled here already
      # imports it through console.dart. Measured on a tree with
      # `import 'dart:io'` added to lib/src/utils/levels.dart: both compiles
      # exited 0 and the whole job stayed green. What does exercise the web
      # is the test run above; what guards the tags is pana below.
      - name: Compile the example for web and wasm
        working-directory: example/logger_builder_examples
        run: |
          set -e
          dart compile js bin/simple_logger.dart -o /tmp/out.js
          dart compile wasm bin/simple_logger.dart -o /tmp/out.wasm

      # The actual badge check. pub.dev advertises platform:web, runtime:web
      # and is:wasm-ready, and pana is what decides those tags, so pana is
      # what has to agree. On the same `dart:io` tree above it dropped all
      # three, which is why the tags are asserted and the score is not. (The
      # comment used to add "while still reporting 160/160". Re-measured on
      # pana 0.23.18: that tree scores 130/160, so the score does move — it
      # just moves for reasons of its own, which is the same argument for
      # not asserting it.)
      - name: Verify the pub.dev platform tags
        run: |
          set -e
          # Pinned (M5, project review 2026-08-20[1]): pana was the only
          # unpinned dependency in this workflow — actions are pinned by SHA,
          # pub dependencies are watched by dependabot — and it runs on every
          # push with its whole transitive tree. The likely accident is not an
          # attack but a bad pana release painting the branch red with nothing
          # changed here. Bump it by hand.
          dart pub global activate pana 0.23.18
          dart pub global run pana --no-warning --json . > /tmp/pana.json
          python3 - <<'EOF'
          import json, sys
          tags = set(json.load(open('/tmp/pana.json')).get('tags', []))
          missing = {'platform:web', 'runtime:web', 'is:wasm-ready'} - tags
          if missing:
              sys.exit(f'pub.dev tags lost: {sorted(missing)}')
          print('platform tags intact')
          EOF

  # The floor, and literally it: `environment.sdk` is ^3.6.0, so this job runs
  # the oldest SDK the package claims to support. 3.6.0 is also the oldest the
  # dev toolchain can manage — lints 5.x needs ^3.6.0. Without this job
  # nothing ever exercises an SDK other than whatever `stable` happens to be
  # on the day.
  #
  # No `dart pub downgrade` here: it resolves every transitive dependency to
  # its minimum, which drags in file 6.0.0 — a dependency of the test runner
  # that no longer compiles against modern dart:io. That says nothing about
  # this package's own bounds, so the check would only produce noise.
  oldest-supported:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.6.0"

      - name: Install dependencies
        run: dart pub get

      # Required, not optional: `dart analyze` from the root descends into
      # example/, whose .dart_tool is git-ignored. Without this step a clean
      # checkout fails with 353 unresolved-import errors and exit 3.
      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Analyze project source
        # --fatal-infos here too: the 3.6.0 analyzer was measured against this
        # tree and reports nothing extra, so the weaker check bought nothing.
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

  # The declared floor of `meta`, which nothing checked. A full
  # `dart pub downgrade` drags in file 6.0.0 — a dependency of the test
  # runner that no longer compiles — so this job analyses and does not test.
  # That is enough for the question it asks: does the package still compile
  # against the oldest dependencies it claims to accept? Measured: the
  # downgrade resolves `meta 1.15.0`, exactly the declared floor.
  oldest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Resolve the lowest allowed dependencies
        run: dart pub downgrade

      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Analyze project source
        run: dart analyze --fatal-infos

  # M15 (project review 2026-08-19[2]): `meta: ^1.15.0` is pinned for one
  # reason — Flutter ships `meta` from its own SDK and older releases pin it
  # to an exact version, so `^1.16.0` made this package unresolvable there —
  # and that reason was never checked by anything. It was checked by hand,
  # with a probe package that lived in a scratch directory and did not
  # survive a restart. The probe is `tool/flutter_probe` now, and this job
  # resolves and analyses it on two Flutters: 3.27.0, the oldest inside
  # `sdk: ^3.6.0` and the one that pins `meta 1.15.0` exactly, and the
  # current stable.
  #
  # `flutter analyze`, not `dart analyze --fatal-infos`: the probe answers
  # "does this resolve and type-check under Flutter", not "is it lint-clean".
  # It carries its own bare analysis_options.yaml so the root one — written
  # for the package proper — does not reach it.
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty version means "whatever is latest on the channel". The
          # action refuses `flutter-version: stable` — that reads as a
          # version literally named stable, and it says so.
          - name: floor
            version: "3.27.0"
          - name: stable
            version: ""

    name: flutter (${{ matrix.name }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable

      - name: Resolve the probe against this package
        working-directory: tool/flutter_probe
        run: flutter pub get

      # Printed, not asserted: the number that matters differs per Flutter
      # (1.15.0 on 3.27, newer on stable), and what is being checked is that
      # a resolution exists at all. The log is where you look when it stops.
      - name: Say what meta resolved to
        working-directory: tool/flutter_probe
        run: flutter pub deps --style=compact | grep '^- meta'

      - name: Analyze the probe
        working-directory: tool/flutter_probe
        run: flutter analyze

  # Warning, not a gate: `environment.sdk` is `^3.6.0`, so the upper bound is
  # `<4.0.0` and nothing exercised it except whatever `stable` happened to be
  # that day. `continue-on-error` keeps someone else's regression in a beta
  # SDK from turning this repository red.
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: beta

      - name: Install dependencies
        run: dart pub get

      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # L7 (project review 2026-08-20[1]): `continue-on-error` gives the job
      # the conclusion `success`, so a beta regression looked exactly like a
      # beta that was fine — nobody would open the log to find out. The
      # annotation is the compromise: the job still does not gate anything,
      # but the run carries a visible warning when it fails.
      - name: Say so when the beta job fails
        if: failure()
        run: >-
          echo "::warning title=beta SDK::The beta job failed. It does not
          gate anything (continue-on-error), so the run stays green — open
          this job's log."
