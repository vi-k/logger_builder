# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: logger_builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A runaway retry loop in a buffered publisher starves the event loop
    # instead of failing a test, so an unbounded job would hang for hours.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Install dependencies
        run: dart pub get

      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos is required: every rule in analysis_options.yaml is
      # reported as info, so a plain `dart analyze` exits 0 on all of them.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
