# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: logger_builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # The strict gate: latest stable, newest dependencies, every check.
  verify:
    runs-on: ubuntu-latest
    # A runaway retry loop in a buffered publisher starves the event loop
    # instead of failing a test, so an unbounded job would hang for hours.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Install dependencies
        run: dart pub get

      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos is required: every rule in analysis_options.yaml is
      # reported as info, so a plain `dart analyze` exits 0 on all of them.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

  # The floor. `environment.sdk` claims ^3.2.0, and for a consumer that is
  # true — the only runtime dependency is meta and the code uses no language
  # feature newer than Dart 3.0. But the dev toolchain cannot go that low
  # (lints 5.x needs ^3.6.0), so 3.6.0 is the oldest SDK this package can be
  # tested on at all. Without this job nothing ever exercises an SDK other
  # than whatever `stable` happens to be on the day.
  #
  # No `dart pub downgrade` here: it resolves every transitive dependency to
  # its minimum, which drags in file 6.0.0 — a dependency of the test runner
  # that no longer compiles against modern dart:io. That says nothing about
  # this package's own bounds, so the check would only produce noise.
  oldest-supported:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.6.0"

      - name: Install dependencies
        run: dart pub get

      # Required, not optional: `dart analyze` from the root descends into
      # example/, whose .dart_tool is git-ignored. Without this step a clean
      # checkout fails with 353 unresolved-import errors and exit 3.
      - name: Install example dependencies
        run: dart pub get --directory=example/logger_builder_examples

      - name: Analyze project source
        # --fatal-infos here too: the 3.6.0 analyzer was measured against this
        # tree and reports nothing extra, so the weaker check bought nothing.
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
