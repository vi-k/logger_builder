name: logger_builder
description: A toolkit for creating your own customizable and hierarchical loggers in Dart.
version: 0.6.2
repository: https://github.com/vi-k/logger_builder
issue_tracker: https://github.com/vi-k/logger_builder/issues

topics:
  - debugging
  - logging

# Matches the `oldest-supported` CI job and the example package, so the
# declared floor is the one actually exercised. Lower would still work for
# pure Dart — the previous review ran the package on a real 3.2.0 SDK — but
# the floor is deliberately pinned to what CI proves.
environment:
  sdk: ^3.6.0

dependencies:
  # Not ^1.16.0: Flutter pins `meta` from its own SDK, with an *exact*
  # version in older releases (3.24 and 3.27 pin 1.15.0), so `^1.16.0` made
  # the package unresolvable there — pub failed with a version-solving error
  # naming meta, on a Flutter whose Dart satisfied our floor. ^1.15.0 is the
  # lowest pin any Flutter within `sdk: ^3.6.0` carries. Nothing here needs a
  # newer meta: only @protected, @visibleForTesting and @immutable are used.
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
