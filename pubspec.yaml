name: logger_builder
description: A toolkit for creating your own customizable and hierarchical loggers in Dart.
version: 0.6.0
repository: https://github.com/vi-k/logger_builder
issue_tracker: https://github.com/vi-k/logger_builder/issues

topics:
  - debugging
  - logging

# Raised from ^3.2.0 to match reality for a Flutter consumer. `^3.2.0` was
# true for pure Dart — verified by running on a real 3.2.0 SDK — but
# unreachable from Flutter: releases 3.16 through 3.27 pin `meta` to 1.10.0
# through 1.15.0 *exactly*, so `meta: ^1.16.0` could not resolve there. The
# first Flutter that works is 3.29, which is Dart 3.7.
environment:
  sdk: ^3.7.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
